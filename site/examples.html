<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="fieldspec forms drawn by three example renderer sets: plain HTML, DialKit and React Aria Components."

    <script type="module" src="/src/examples.tsx"></script>
